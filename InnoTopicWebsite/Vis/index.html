<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>AI Architecture · 3D</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  :root{
    --bg:#05070d; --panel:rgba(12,17,30,.72); --line:rgba(140,170,220,.18);
    --text:#e6edf7; --muted:#8fa0bb;
  }
  /* per-visualization accents: heading/progress gradient, primary button, floor overlay label */
  body[data-vis="rag"]{ --acc1:#3ad7ff; --acc2:#ff5fd2; --primary:rgba(58,215,255,.28),rgba(255,95,210,.28); --primary-line:rgba(160,200,255,.35);
    --ov:#9fd8ff; --ov-bg:rgba(8,14,26,.6); --ov-bg-hot:rgba(20,34,60,.85); --ov-line:rgba(159,216,255,.45) }
  body[data-vis="agentic"]{ --acc1:#ff5fd2; --acc2:#ffb547; --primary:rgba(255,95,210,.3),rgba(255,181,71,.28); --primary-line:rgba(255,190,230,.35);
    --ov:#ff9be6; --ov-bg:rgba(26,8,22,.6); --ov-bg-hot:rgba(60,20,50,.85); --ov-line:rgba(255,155,230,.5) }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #scene{position:fixed;inset:0}
  /* z-index makes this a stacking context: CSS2DRenderer gives each label a z-index (up to the label
     count) for depth order, which otherwise competed with, and covered, the panels (z-index 5+). */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:1}
  .glass{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.45)}
  /* header */
  #hud{position:fixed;top:18px;left:18px;padding:16px 18px;width:372px;z-index:5}
  #hud h1{margin:0 0 4px;font-size:18px;letter-spacing:.2px;font-weight:700}
  #hud h1 span{background:linear-gradient(90deg,var(--acc1),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  #hud p{margin:0 0 12px;color:var(--muted);font-size:12.5px;line-height:1.45}
  .btns{display:flex;gap:7px;flex-wrap:wrap}
  /* search: highlights matching components (by name or technology) and dims the rest */
  .search{display:flex;align-items:center;gap:4px;margin:0 0 12px;padding:3px 4px 3px 10px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
  .search:focus-within{border-color:var(--primary-line)}
  .search.invalid{border-style:dashed;border-color:#ffb547}
  .search input{flex:1;min-width:0;font:inherit;font-size:12.5px;color:var(--text);background:transparent;border:0;outline:0;padding:4px 0}
  .search input::placeholder{color:var(--muted)}
  .search input::-webkit-search-cancel-button{display:none}
  .search-count{font-size:11px;color:var(--muted);white-space:nowrap}
  .search .opt{padding:3px 6px;font:600 11px/1 ui-monospace,monospace;border-color:transparent;background:transparent;color:var(--muted)}
  .search .opt[aria-pressed="true"]{color:var(--text);border-color:var(--primary-line);background:rgba(255,255,255,.1)}
  button{font:inherit;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9px;padding:7px 10px;transition:.15s}
  button:hover{background:rgba(255,255,255,.12)}
  button.primary{background:linear-gradient(135deg,var(--primary));border-color:var(--primary-line)}
  button.on{border-color:rgba(78,240,160,.55);color:#bfffe0}
  .brand{display:inline-block;margin:0 0 12px;opacity:.92;transition:opacity .15s}
  .brand:hover{opacity:1}
  .brand img{display:block;height:28px;width:auto}
  /* visualization selector */
  .vis-switch{display:flex;margin:0 0 12px;padding:3px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
  .vis-switch a{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 8px;border-radius:7px;transition:.15s}
  .vis-switch a:hover{color:var(--text);background:rgba(255,255,255,.07)}
  .vis-switch a[aria-current="page"]{color:var(--text);background:rgba(255,255,255,.13);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  /* legend */
  #legend{position:fixed;left:18px;bottom:18px;padding:14px 16px;z-index:5;font-size:12px;width:352px}
  #legend h3{margin:0 0 8px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600}
  .lg-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;margin-bottom:10px}
  .lg{display:flex;align-items:center;gap:8px;color:#cdd7e8;white-space:nowrap}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
  .flow{width:22px;height:3px;border-radius:3px;flex:none;box-shadow:0 0 8px currentColor}
  #legend .hint{color:var(--muted);font-size:11px;margin-top:4px;line-height:1.4}
  /* info panel */
  #info{position:fixed;top:18px;right:18px;width:330px;padding:18px;z-index:5;
    transform:translateX(24px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
  #info.show{opacity:1;transform:none;pointer-events:auto}
  #info .chip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;
    padding:4px 9px;border-radius:99px;border:1px solid currentColor;font-weight:700}
  #info h2{margin:10px 0 8px;font-size:20px}
  #info p{margin:0 0 12px;color:#cbd5e6;font-size:13.5px;line-height:1.55}
  #info .ex{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;line-height:1.5}
  #info .ex b{color:#dbe4f3;font-weight:600}
  /* The close button shares the chip's row, centered on it (as in the card's header). */
  #info .info-top{display:flex;align-items:center;gap:8px}
  #info .close{margin-left:auto;padding:3px 8px;font-size:14px;line-height:1}
  #info{max-height:calc(100vh - 36px);overflow:auto;touch-action:pan-y}
  #info .stack{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  #info .stack h4{margin:0 0 8px;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700}
  #info .chips{display:flex;flex-wrap:wrap;gap:6px}
  .tchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 9px 5px 6px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#dbe4f3}
  .tchip img{width:16px;height:16px;object-fit:contain}
  .tchip.pill{padding:5px 9px;color:#b9c6da;font-style:normal}
  .tchip.pill::before{content:'';width:6px;height:6px;border-radius:2px;background:#6f87a6}
  .ihint{margin-top:10px;font-size:11px;color:#7fa6c9}
  /* caption */
  #caption{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);width:min(640px,calc(100vw - 760px));min-width:380px;
    padding:14px 18px 16px;z-index:6;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
  #caption.show{opacity:1;transform:translate(-50%,0)}
  #caption .meta{display:flex;justify-content:space-between;gap:10px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  #caption .meta b{color:var(--acc1)}
  #caption .meta .it{color:var(--ov)}
  #caption .txt{font-size:14.5px;line-height:1.5}
  #caption .txt code{font-size:13px;color:#ffd6a0}
  #caption .bar{height:3px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:10px;overflow:hidden}
  #caption .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc1),var(--acc2));transition:width .4s}
  /* node labels */
  .nlabel{pointer-events:auto;cursor:pointer;user-select:none;font-size:12px;font-weight:600;letter-spacing:.2px;
    padding:4px 9px 4px 8px;background:rgba(8,12,22,.66);border:1px solid rgba(255,255,255,.12);
    display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:11px;white-space:nowrap;transition:opacity .3s,transform .2s,background .2s;touch-action:none}
  .nlabel i{width:7px;height:7px;border-radius:50%;box-shadow:0 0 8px currentColor;background:currentColor}
  .nlabel .nm{display:flex;align-items:center;gap:6px}
  .nlabel.big{font-size:15px;padding:6px 12px}
  .nlabel.dim{opacity:.28}
  .nlabel.hot{background:rgba(30,40,70,.9);border-color:currentColor;transform:scale(1.12)}
  .orchlabel{pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 12px;border-radius:12px;
    background:var(--ov-bg);border:1px dashed var(--ov-line);color:var(--ov);transition:opacity .3s,background .2s;touch-action:none}
  .orchlabel .t{font-size:10.5px;letter-spacing:2.2px;font-weight:700;text-transform:uppercase}
  .orchlabel .s{font-size:10.5px;color:#d9b6cf;letter-spacing:.3px}
  .orchlabel:hover,.orchlabel.hot{background:var(--ov-bg-hot)}
  .orchlabel.dim{opacity:.3}
  /* detail card */
  #card{position:fixed;top:18px;right:18px;width:440px;max-height:calc(100vh - 36px);overflow:auto;z-index:8;padding:16px 18px 18px;
    opacity:0;transform:translateX(30px);pointer-events:none;transition:opacity .25s,transform .25s;touch-action:pan-y;overscroll-behavior:contain}
  #card.show{opacity:1;transform:none;pointer-events:auto}
  #card::-webkit-scrollbar{width:8px}#card::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
  .card-top{display:flex;align-items:center;gap:8px;position:sticky;top:-16px;margin:-16px -18px 0;padding:12px 18px 10px;background:#0d121f;z-index:2;border-radius:14px 14px 0 0;box-shadow:0 6px 12px -6px rgba(0,0,0,.6)}
  .card-top .chip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:4px 9px;border-radius:99px;border:1px solid currentColor;font-weight:700}
  .card-top .close{margin-left:auto;padding:3px 9px;font-size:15px;line-height:1}
  #card-back{padding:3px 8px;font-size:13px;line-height:1}
  #card h2{margin:8px 0 6px;font-size:22px}
  #card .lead{color:#cbd5e6;font-size:13.5px;line-height:1.6;margin:0 0 6px}
  #card h4{margin:16px 0 8px;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .kc{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px;line-height:1.45}
  .kc dt{color:#e6edf7;font-weight:600;white-space:nowrap}.kc dd{margin:0;color:#aebbd0}
  .io{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .io div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12.5px;color:#cbd5e6;line-height:1.45}
  .io b{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .tips{margin:0;padding-left:18px;font-size:12.5px;color:#cbd5e6;line-height:1.55}.tips li{margin:2px 0}
  .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tt{display:flex;gap:9px;align-items:flex-start;padding:9px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer;transition:background .15s,border-color .15s}
  .tt:hover{background:rgba(255,255,255,.09);border-color:rgba(160,200,255,.35)}
  .tt .lg2{width:26px;height:26px;flex:none;border-radius:7px;background:rgba(255,255,255,.07);display:grid;place-items:center}
  .tt .lg2 img{width:18px;height:18px;object-fit:contain}
  .nologo{font-size:10.5px;font-weight:800;color:#9fb2cc;letter-spacing:.3px}
  .tt .nm2{font-size:12.5px;font-weight:600;color:#e6edf7;line-height:1.25}
  .tt a{color:#e6edf7;text-decoration:none;border-bottom:1px dotted rgba(230,237,247,.4)}.tt a:hover{color:#7fd8ff;border-color:#7fd8ff}
  .tt .ds{font-size:11.5px;color:#93a3bc;line-height:1.35;margin-top:2px}
  .cchips{display:flex;flex-wrap:wrap;gap:6px}
  .cchip{font:inherit;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#dbe4f3}
  .cchip:hover{background:rgba(255,255,255,.12)} .cchip i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
  .thead{display:flex;gap:14px;align-items:center;margin-top:8px}
  .thead .big{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);display:grid;place-items:center;flex:none}
  .thead .big img{width:36px;height:36px;object-fit:contain}.thead .big .nologo{font-size:16px}
  .thead h2{margin:0 0 6px!important}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#cbd5e6}
  .tag.cat{color:#9fd8ff;border-color:rgba(159,216,255,.35)}
  .golink{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12.5px;font-weight:600;color:#0b1020;background:#9fd8ff;padding:7px 12px;border-radius:9px;text-decoration:none}
  .golink:hover{background:#c6ebff}
  .alts{display:flex;flex-wrap:wrap;gap:8px}
  .alt{display:flex;flex-direction:column;align-items:center;gap:5px;width:78px;padding:9px 4px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer;font-size:11px;color:#cbd5e6;text-align:center;line-height:1.2}
  .alt:hover{background:rgba(255,255,255,.1)} .alt .lg2{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.07);display:grid;place-items:center}.alt img{width:20px;height:20px;object-fit:contain}
  .note{font-size:11px;color:#7d8ca5;margin-top:14px;line-height:1.45}
  .zoomgrp{display:inline-flex;gap:0}.zoomgrp button{border-radius:0;padding:8px 12px;min-width:36px}.zoomgrp button:first-child{border-radius:9px 0 0 9px}.zoomgrp button:last-child{border-radius:0 9px 9px 0;border-left:none}
  #tip{position:fixed;z-index:9;pointer-events:none;padding:7px 10px;border-radius:9px;background:rgba(10,15,28,.92);border:1px solid rgba(160,200,255,.3);
    font-size:12px;color:#dbe4f3;display:flex;flex-direction:column;gap:2px;opacity:0;transition:opacity .12s;max-width:260px}
  #tip.show{opacity:1} #tip span{color:#93a3bc;font-size:11px}
  #loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;letter-spacing:1px;z-index:10;transition:opacity .5s}
</style>
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

} }

<body>
<div id="loading">LOADING 3D SCENE…</div>
<div id="scene"></div>
<div id="labels"></div>

<div id="hud" class="glass">
  <a class="brand" href="https://innotopic.com" target="_blank" rel="noopener noreferrer"><img src="innotopic-logo.svg" alt="InnoTopic"></a>
  <nav class="vis-switch" id="vis-switch" aria-label="Visualization"></nav>
  <h1 id="hud-title"></h1>
  <p id="hud-intro"></p>
  <div class="search" id="search">
    <input id="search-input" type="search" placeholder="Search components &amp; tech…" autocomplete="off" spellcheck="false"
           aria-label="Search components and technologies (Ctrl+Alt+F); Enter flies to the next match" aria-keyshortcuts="Control+Alt+F">
    <span class="search-count" id="search-count" aria-live="polite"></span>
    <button id="search-case" class="opt" aria-pressed="false" aria-label="Match case" title="Match case (Ctrl+Alt+M)">Aa</button>
    <button id="search-regex" class="opt" aria-pressed="false" aria-label="Regular expression" title="Regular expression (Ctrl+Alt+R)">.*</button>
  </div>
  <div class="btns">
    <button id="play" class="primary"></button>
    <button id="rotate" class="on" title="Auto-rotate">⟳ Auto-rotate</button>
    <button id="reset">⌖ Reset view</button>
    <button id="wheelzoom" title="Let the mouse wheel zoom the 3D scene">🖱 Wheel zoom: off</button>
    <span class="zoomgrp"><button id="zoomout" title="Zoom out">−</button><button id="zoomin" title="Zoom in">+</button></span>
  </div>
</div>

<div id="legend" class="glass">
  <h3>Layers</h3>
  <div class="lg-grid" id="lg-layers"></div>
  <h3 id="lg-flows-title"></h3>
  <div class="lg-grid" id="lg-flows"></div>
  <div class="hint" id="hint">Drag to orbit · Right-drag / Shift-drag to pan · Pinch or +/− to zoom · wheel zoom: off</div>
</div>

<div id="info" class="glass">
  <div class="info-top"><span class="chip" id="info-chip"></span><button class="close" id="info-close" title="Close">×</button></div>
  <h2 id="info-title"></h2>
  <p id="info-desc"></p>
  <div class="ex" id="info-ex"></div>
  <div class="stack" id="info-stack"><h4>Tech stack</h4><div class="chips" id="info-chips"></div></div>
  <div class="ihint" id="info-hint">Click for details, concepts &amp; related tech →</div>
</div>

<div id="card" class="glass" role="dialog" aria-modal="false" aria-labelledby="card-title">
  <div class="card-top"><button id="card-back" title="Back">←</button><span class="chip" id="card-chip"></span><button class="close" id="card-close" title="Close (Esc)">×</button></div>
  <div id="card-body"></div>
</div>

<div id="tip"></div>
<div id="caption" class="glass">
  <div class="meta"><span id="cap-step"></span><span class="it" id="cap-it"></span><b id="cap-node"></b></div>
  <div class="txt" id="cap-text"></div>
  <div class="bar"><i id="cap-bar"></i></div>
</div>

<script>
/* pick the visualization (?vis=rag | agentic) and fill in its page texts before the 3D module loads */
(() => {
  const PAGES = {
    rag: { tab:'RAG architecture', title:'RAG Architecture · 3D',
      h1:'<span>RAG</span> · AI Application Architecture',
      intro:'Documents are indexed ahead of time; each query retrieves the best context and feeds it to the LLM. Hover for a summary, click for details.',
      play:'▶ Play query', flows:'Data flow' },
    agentic: { tab:'Agentic AI', title:'Agentic AI Architecture · 3D',
      h1:'<span>Agentic AI</span> · Components &amp; Relationships',
      intro:'An agent is an LLM in a loop: it observes its context, thinks, and acts through tools — with memory, sub-agents and guardrails around it. Hover for a summary, click for details.',
      play:'▶ Play agent run', flows:'Relationships' },
  };
  const want = new URLSearchParams(location.search).get('vis');
  const id = want in PAGES ? want : 'rag', P = PAGES[id];
  document.body.dataset.vis = id;
  document.title = P.title;
  document.getElementById('hud-title').innerHTML = P.h1;
  document.getElementById('hud-intro').textContent = P.intro;
  document.getElementById('play').textContent = P.play;
  document.getElementById('lg-flows-title').textContent = P.flows;
  document.getElementById('vis-switch').innerHTML = Object.entries(PAGES).map(([k, p]) =>
    `<a href="?vis=${k}"${k === id ? ' aria-current="page"' : ''}>${p.tab}</a>`).join('');
})();
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------------- brand logos (shared by all visualizations) ----------------
   Real brand SVGs embedded as markup (no network needed). Sources: Simple Icons v16.35.0,

ses from Zilliz that returns stored answers for similar queries.","short":"Semantic cache for LLM calls"},"mcp":{"name":"Model Context Protocol","logo":"mcp","cat":"Tool protocol","lic":"Open standard","url":"https://modelcontextprotocol.io","what":"An open protocol, introduced by Anthropic, that standardises how AI applications connect to tools and data sources through MCP servers.","short":"Open standard for AI tools"},"nvidia":{"name":"NVIDIA NeMo Guardrails","logo":"nvidia","cat":"Guardrails & safety","lic":"Open source","url":"https://github.com/NVIDIA/NeMo-Guardrails","what":"An open-source toolkit from NVIDIA for adding programmable input, output and dialog rails to LLM applications.","short":"Programmable rails for LLM apps"},"guardrailsai":{"name":"Guardrails AI","logo":"guardrailsai","cat":"Guardrails & safety","lic":"Open source","url":"https://www.guardrailsai.com","what":"An open-source Python framework that validates LLM inputs and outputs using reusable validators from the Guardrails Hub.","short":"Validators for LLM I/O"},"llamaguard":{"name":"Llama Guard","logo":"meta","cat":"Guardrails & safety","lic":"Open weights","url":"https://www.llama.com","what":"An open-weight safety classifier model from Meta that labels prompts and responses as safe or unsafe across hazard categories.","short":"Safety classifier model (Meta)"},"langsmith":{"name":"LangSmith","logo":"langsmith","cat":"Observability & evaluation","lic":"Managed service","url":"https://www.langchain.com/langsmith","what":"A platform from LangChain for tracing, debugging, evaluating and monitoring LLM applications; it works with or without LangChain.","short":"Tracing & evals platform"},"langfuse":{"name":"Langfuse","logo":"langfuse","cat":"Observability & evaluation","lic":"Open source + managed cloud","url":"https://langfuse.com","what":"An open-source LLM engineering platform for tracing, prompt management, evaluations and metrics; self-host or use the cloud.","short":"Open-source LLM trac const DEEP = {"docs": {"deep": "Ingestion starts by connecting to the systems where knowledge lives and pulling documents on a schedule or when they change. Each file is parsed into clean text plus structure (headings, tables, lists) and metadata such as source, date and access permissions. Parsing quality matters more than people expect: a table flattened into gibberish or a scanned PDF without OCR simply cannot be retrieved later. Most teams re-sync incrementally so updated or deleted documents are reflected in the index.", "concepts": [["Connectors / loaders", "Pull data from drives, wikis, ticketing tools, databases and websites."], ["Parsing & OCR", "Extract text, tables and layout from PDFs, Office files and scans."], ["Metadata", "Source, timestamps and permissions, used later for filtering and citations."], ["Incremental sync", "Only re-process documents that changed or were deleted."]], "inp": "Raw files, pages and records from source systems.", "out": "Clean text elements with structure and metadata.", "tips": ["Carry document access permissions through and enforce them at query time.", "Deduplicate near-identical documents.", "Inspect parsed output for tables and scanned PDFs before indexing."]}, "chunk": {"deep": "Chunking splits each parsed document into passages small enough to embed precisely and to fit several into the LLM's context window. Splitters usually work recursively (by sections, then paragraphs, then sentences) until pieces fall under a target size measured in tokens. A small overlap between neighbouring chunks keeps sentences that straddle a boundary retrievable from either side. Each chunk carries its parent document's metadata so it can be filtered, cited and expanded back to its surrounding context.", "concepts": [["Chunk size", "Often a few hundred tokens; smaller gives precise matches, larger gives more context per hit."], ["Overlap", "Tokens shared between neighbouring chunks, commonly 10–20% of the chunk size."], ["Structure-aware splitting", "Break at headings, paragraphs or topic shifts instead of fixed lengths."], ["Parent–child (small-to-big)", "Retrieve small chunks, then pass their larger parent section to the LLM."]], "inp": "Parsed document text and metadata.", "out": "A list of chunks (text, position, metadata).", "tips": ["Tune chunk size against real user questions.", "Don't split tables or code blocks in the middle.", "Prefix each chunk with its document title or section path so it stands on its own."]}, "embed": {"deep": "An embedding model is a neural network that maps text to a fixed-length vector so that passages with similar meaning land near each other. During ingestion every chunk is embedded once and stored; at query time the question is embedded with the same model and compared with a similarity metric. The choice of model affects retrieval quality, language coverage, vector size (and therefore storage) and speed. Switching models later means re-embedding the whole corpus, because vectors from different models are not comparable.", "concepts": [["Dimensions", "Length of each vector, typically hundreds to a few thousand numbers."], ["Similarity metric", "Cosine similarity or dot product, matching how the model was trained."], ["Max input length", "Text beyond the model's token limit is truncated — another reason to chunk."], ["Batching", "Embedding many chunks per request for throughput."]], "inp": "Chunk text.", "out": "One dense vector per chunk.", "tips": ["Benchmark candidate models on your own queries; the public MTEB leaderboard is a starting point.", "Store the model name alongside the vectors.", "Use the same text preprocessing for documents and queries."]}, "vdb": {"deep": "A vector database stores embeddings together with chunk text and metadata, and quickly answers “which k vectors are nearest to this one?” across millions of items. Comparing against every vector would be too slow, so it builds an approximate nearest neighbour (ANN) index that trades a little recall for large speedups. Most also apply metadata filters (for example department or date) alongside the similarity search, and many add keyword or hybrid search. Updates, deletes, replication and multi-tenancy matter as much as raw speed in production.", "concepts": [["HNSW", "Graph-based ANN index: fast and accurate, but memory-hungry."], ["IVF", "Clusters vectors and searches only the closest clusters; often combined with quantization."], ["Distance metric", "Cosine, dot product or Euclidean (L2) — must match the embedding model."], ["Top-k & filters", "How many neighbours to return and which metadata constraints apply."], ["Quantization", "Compressing vectors (e.g. product or binary quantization) to save memory at some accuracy cost."]], "inp": "Writes: vectors, chunk text, metadata. Reads: a query vector plus filters.", "out": "The top-k nearest chunks with similarity scores.", "tips": ["Use the distance metric your embedding model was trained for.", "Plan for deletes and re-indexing when documents change.", "If you already run PostgreSQL, pgvector may be enough before adopting a dedicated system."]}, "kg": {"deep": "A knowledge graph stores entities (people, products, policies) as nodes and their relationships as edges, usually extracted from documents by an LLM or NLP pipeline. At query time the system can find the entities mentioned in a question and follow their connections, which helps with multi-hop questions that no single chunk answers. Approaches such as GraphRAG also summarise clusters of related entities to answer broad “what are the main themes?” questions. It complements vector search rather than replacing it.", "concepts": [["Entities & relations", "Nodes and typed edges, e.g. Product → covered by → Policy."], ["Entity extraction", "An LLM or NER pipeline that builds the graph from text."], ["Multi-hop traversal", "Following edges to connect facts spread across documents."], ["Query language", "For example Cypher in Neo4j."]], "inp": "Documents or chunks (build); entities found in the query (read).", "out": "Related entities, facts and linked chunks.", "tips": ["Start with a narrow schema of the entity types your questions need.", "Spot-check extraction quality — it varies.", "Use it where relationships matter; plain vector search is often enough."]}, "user": {"deep": "The user reaches the system through a chat UI, a search box, an IDE plugin, voice or another application calling the API. Their question is often short, ambiguous or depends on earlier turns (“what about annual plans?”), which is why later steps rewrite it. Who the user is also matters: permissions decide which documents may be retrieved, and preferences can shape the answer. Streaming the answer token by token makes the system feel fast even when generation takes a few seconds.", "concepts": [["Session", "The ongoing conversation and its history."], ["Identity & permissions", "Determine which sources may be used for this user."], ["Feedback", "Ratings or corrections, valuable for evaluation."]], "inp": "A question or instruction.", "out": "A grounded answer with sources.", "tips": ["Show sources so users can verify answers.", "Make it easy to give feedback.", "Be clear about what the assistant knows and doesn't."]}, "app": {"deep": "The application backend is the conductor: it authenticates the request, loads conversation state and calls each pipeline step in order — cache, guardrails, retrieval, prompt building, the LLM and tools. It usually exposes a streaming API (Server-Sent Events or WebSockets) so tokens reach the user as they are generated. It also handles retries, timeouts, rate limits and fallbacks between model providers. This is where most orchestration-framework code lives.", "concepts": [["Streaming", "Send tokens incrementally over SSE or WebSockets."], ["Session state", "Conversation history and user context."], ["Retries & fallbacks", "Recover from provider errors and timeouts."], ["Rate limits & quotas", "Protect cost and capacity."]], "inp": "An HTTP request with the user message and session.", "out": "A streamed response, plus logs and traces.", "tips": ["Put a timeout on every external call.", "Version prompts and pipeline configuration.", "Propagate one request ID end-to-end for tracing."]}, "rewrite": {"deep": "Users rarely phrase questions the way documents are written, and follow-up questions depend on context the retriever can't see. Query rewriting uses an LLM — often a small, fast one — to produce a standalone, search-friendly version of the question from the chat history. Variants generate several paraphrases (multi-query) or a hypothetical answer to embed instead of the question (HyDE). Some systems also route the query to the right index or decide whether retrieval is needed at all.", "concepts": [["Condense question", "Merge chat history into one standalone query."], ["Multi-query", "Several paraphrases retrieved in parallel, results merged."], ["HyDE", "Embed a hypothetical answer rather than the question itself."], ["Routing", "Choose which index, tool or pipeline should handle the query."]], "inp": "The raw user message and chat history.", "out": "One or more rewritten search queries.", "tips": ["Use a small, fast model to keep latency low.", "Log the rewritten query — it explains many retrieval failures.", "Make sure rewriting keeps exact terms such as product codes."]}, "qembed": {"deep": "The rewritten query is turned into a vector by the same embedding model that indexed the documents, so both live in the same “meaning space”. Some models expect a different instruction or prefix for queries than for documents. Because this runs on every request it sits on the critical path for latency, and embeddings of frequent queries are often cached. The vector goes straight to the retriever.", "concepts": [["Same model as ingestion", "Vectors from different models are not comparable."], ["Query vs document prefixes", "Some models use task-specific instructions for each side."], ["Latency", "Runs on every request, so speed matters."]], "inp": "Rewritten query text.", "out": "A query vector.", "tips": ["Verify the model matches the one used for the index.", "Cache embeddings of frequent queries.", "Apply the same text normalization as at ingestion."]}, "retriever": {"deep": "The retriever finds candidate chunks likely to contain the answer. Vector search captures meaning (“refund” ≈ “money back”), while keyword search such as BM25 catches exact terms like product codes, names and error messages; hybrid retrieval runs both and merges the ranked lists, commonly with reciprocal rank fusion (RRF). Metadata filters restrict results to what the user may see or what is relevant. It deliberately returns more candidates than needed so the reranker can pick the best.", "concepts": [["Top-k", "Number of candidates returned — often dozens before reranking."], ["BM25", "Classic keyword relevance scoring based on term frequency."], ["Reciprocal rank fusion", "Merges ranked lists from vector and keyword search."], ["Metadata filtering", "Restrict by permissions, source, date and so on."], ["Graph expansion", "Optionally add facts linked in the knowledge graph."]], "inp": "Query vector, query text and filters.", "out": "Ranked candidate chunks with scores.", "tips": ["Hybrid search is a strong default for business documents.", "Enforce access permissions here, not only in the UI.", "Measure recall (is the right chunk in the top-k?) separately from answer quality."]}, "rerank": {"deep": "First-stage retrieval compares a query vector with precomputed document vectors, which is fast but approximate. A reranker — usually a cross-encoder — reads the query and each candidate together and outputs a relevance score, which is far more accurate but too slow to run over the whole corpus. Running it on the top few dozen candidates and keeping the best handful noticeably improves what the LLM sees. Fewer, better chunks also mean shorter prompts, lower cost and less distraction for the model.", "concepts": [["Cross-encoder", "Scores the query and passage jointly in a single model pass."], ["Top-n", "How many chunks survive reranking — often 3–10."], ["Score threshold", "Drop candidates below a relevance cutoff."], ["Latency budget", "Cost grows with the number of candidates scored."]], "inp": "The query and candidate chunks.", "out": "A reordered, trimmed list of the most relevant chunks.", "tips": ["Rerank a moderate candidate set to balance quality and latency.", "Use a threshold so irrelevant chunks don't fill the prompt.", "Compare results with and without reranking on your own data."]}, "prompt": {"deep": "The prompt builder assembles everything the LLM will read: system instructions (role, tone, rules such as “answer only from the sources”), the selected chunks with source labels, relevant memory, tool definitions and the user's question. It has to fit within the model's context window while leaving room for the answer, so it counts tokens and trims or summarises when needed. Ordering and formatting matter: clearly delimited, labelled sources make citations and grounding much more reliable.", "concepts": [["Context window", "Maximum tokens the model can process in one call (input plus output)."], ["Token budget", "How space is split between instructions, sources, history and the answer."], ["System prompt", "Rules and persona that frame every answer."], ["Source labels", "Numbered or named sources the model can cite."]], "inp": "Instructions, reranked chunks, memory, tool schemas and the question.", "out": "The final prompt messages sent to the LLM.", "tips": ["Tell the model what to do when the sources don't contain the answer.", "Put the most relevant chunks where the model attends well, often first.", "Version prompts and test changes against an evaluation set."]}, "llm": {"deep": "A large language model is a transformer network that predicts the next token from everything before it, repeating that step to write an answer. In RAG it acts as reader and writer: it reads the retrieved sources in its context window and composes an answer grounded in them, instead of relying only on what it memorised in training. Modern models can also decide to call tools and continue after seeing the results, which turns a pipeline into an agent. Sampling settings control how deterministic or creative the output is.", "concepts": [["Context window", "How many tokens fit in one request, input and output combined."], ["Temperature", "Sampling randomness; low values suit factual RAG answers."], ["Max output tokens", "Upper limit on the answer length."], ["Tool / function calling", "The model emits structured calls that the app executes."], ["Streaming", "Tokens are returned as they are generated."]], "inp": "Prompt messages: instructions, sources, question and tool results.", "out": "Generated answer text and/or tool calls.", "tips": ["Use a low temperature for factual answers.", "Ask for citations, and allow “I don't know” when sources are missing.", "Retrieve well rather than stuffing everything into a long context — it costs more and can dilute attention."]}, "response": {"deep": "The final answer is streamed back to the user, ideally with citations linking to the sources it used. Before display it passes output guardrails, and the app may post-process it: rendering Markdown, turning citation markers into links or suggesting follow-up questions. The answer, its sources and any user feedback are logged so the team can evaluate quality over time.", "concepts": [["Citations", "References to the source chunks behind each claim."], ["Streaming", "Progressive display for perceived speed."], ["Feedback capture", "Ratings or corrections stored with the trace."]], "inp": "LLM output that passed the guardrails.", "out": "A formatted answer shown to the user.", "tips": ["Make citations clickable.", "Handle “no answer found” gracefully.", "Store feedback together with the trace ID."]}, "tools": {"deep": "Function calling lets the model request actions it can't perform itself: searching the web, querying a database, running code or calling an internal API. The app describes each tool with a name, a description and a JSON Schema for its arguments; the model replies with a structured call, the app runs it and returns the result, and the model continues. The Model Context Protocol (MCP) standardises how tools and data sources are exposed to AI applications. Agentic RAG uses the same mechanism to let the model decide when and what to retrieve.", "concepts": [["Tool schema", "Name, description and JSON Schema for the arguments."], ["Tool-call loop", "Model calls, app executes, result goes back into the context."], ["MCP server", "A standard way to expose tools and resources to AI apps."], ["Permissions", "Which tools may run, with what scope, and when to ask a human."]], "inp": "A structured tool call from the LLM.", "out": "The tool result, returned to the LLM.", "tips": ["Write precise tool descriptions — the model picks tools from them.", "Validate arguments; never trust them blindly.", "Require confirmation for actions with side effects."]}, "memory": {"deep": "Short-term memory is the conversation so far, kept in the prompt or summarised when it grows long. Long-term memory stores durable facts about the user or task across sessions — preferences, past decisions, account details — usually extracted by an LLM and retrieved by similarity, much like documents. Relevant memories are injected into the prompt, and new facts are written back after the conversation. Good memory makes an assistant feel personal; bad memory surfaces stale or wrong facts.", "concepts": [["Conversation buffer", "Recent messages kept in the prompt."], ["Summarisation", "Compress older turns to save tokens."], ["Long-term store", "Per-user facts retrieved by similarity or key."], ["Write-back", "Extract new facts after each interaction."]], "inp": "Conversation turns; queries for relevant memories.", "out": "Relevant memories added to the prompt.", "tips": ["Let users see and delete what is remembered.", "Timestamp memories and prefer recent ones.", "Keep each user's memories strictly isolated."]}, "guard": {"deep": "Guardrails wrap the model with checks on both sides. Input rails detect prompt injection and jailbreak attempts, disallowed or off-topic requests, and personal data that should be redacted before it reaches a model. Output rails check that the answer is safe, on-policy, free of leaked secrets and supported by the retrieved sources. They can be rules, classifiers, dedicated safety models or LLM-based checks, and because they add latency teams balance strictness against speed.", "concepts": [["Prompt injection", "Malicious instructions hidden in user input or retrieved documents."], ["PII redaction", "Detect and mask personal data."], ["Safety classifiers", "Flag harmful content categories."], ["Grounding check", "Verify that claims are supported by the sources."]], "inp": "User input (input rails); model output and sources (output rails).", "out": "Pass, block, or a modified (e.g. redacted) message.", "tips": ["Treat retrieved documents as untrusted input too.", "Log blocked requests to tune false positives.", "Run cheap checks first and expensive ones only when needed."]}, "cache": {"deep": "A semantic cache stores previous questions with their answers, keyed by the question's embedding rather than its exact text. When a new question is similar enough to a cached one, the stored answer is returned immediately, skipping retrieval and generation. This cuts latency and cost for repeated questions such as FAQs. The similarity threshold and expiry rules set the trade-off between hit rate and the risk of serving a wrong or stale answer.", "concepts": [["Similarity threshold", "How close a new query must be to count as a hit."], ["TTL / invalidation", "Expire entries when source documents change."], ["Exact vs semantic", "Exact text match is safe; semantic match also catches paraphrases."], ["Scope", "Per-user versus shared caching."]], "inp": "An incoming query (and its embedding).", "out": "A cached answer (hit) or a miss.", "tips": ["Don't share cached answers across users when content is permission-restricted.", "Invalidate entries when documents are updated.", "Start with a conservative threshold."]}, "eval": {"deep": "Observability tools record a trace for every request: each pipeline step, its inputs and outputs, latency, token usage and cost. Evaluation scores quality — offline against a test set of questions with known answers, and online by sampling production traffic and collecting user feedback. RAG-specific metrics separate retrieval problems (was the right chunk found?) from generation problems (did the answer stay faithful to it?). Together they let teams change prompts, models or chunking with evidence instead of guesswork.", "concepts": [["Tracing", "Spans for each pipeline step, often via OpenTelemetry."], ["Faithfulness", "Is the answer supported by the retrieved context?"], ["Context precision & recall", "Did retrieval find the right chunks, without noise?"], ["LLM-as-judge", "A model grades answers against defined criteria."], ["Golden dataset", "Curated questions and expected answers for regression tests."]], "inp": "Traces, outputs, user feedback and test sets.", "out": "Dashboards, scores, alerts and regression reports.", "tips": ["Build a small golden set early and run it on every change.", "Evaluate retrieval and generation separately.", "Track cost and latency alongside quality."]}, "orch": {"deep": "Orchestration frameworks provide building blocks for the pipeline: document loaders, text splitters, retrievers, prompt templates, model clients, tool integrations and memory. They let you compose these into chains or graphs and swap components — a different vector store or model — without rewriting the app. Agent frameworks such as LangGraph add explicit state and control flow for multi-step and multi-agent workflows. Many teams start with a framework and replace parts with plain code as their needs become specific.", "concepts": [["Chains / pipelines", "Fixed sequences of steps."], ["Graphs & state", "Branching, loops and retries for agents."], ["Integrations", "Ready-made connectors for models, vector stores and tools."], ["Callbacks & tracing hooks", "Feed observability tools."]], "inp": "Application logic and configuration.", "out": "A runnable RAG or agent pipeline.", "tips": ["Understand what an abstraction does underneath — debugging gets easier.", "Pin dependency versions; these libraries change quickly.", "Don't adopt a framework just for a single model call."]}};

m Meta that labels prompts and responses as safe or unsafe across hazard categories.","short":"Safety classifier model (Meta)"},"langsmith":{"name":"LangSmith","logo":"langsmith","cat":"Observability & evaluation","lic":"Managed service","url":"https://www.langchain.com/langsmith","what":"A platform from LangChain for tracing, debugging, evaluating and monitoring LLM applications; it works with or without LangChain.","short":"Tracing & evals platform"},"langfuse":{"name":"Langfuse","logo":"langfuse","cat":"Observability & evaluation","lic":"Open source + managed cloud","url":"https://langfuse.com","what":"An open-source LLM engineering platform for tracing, prompt management, evaluations and metrics; self-host or use the cloud.","short":"Open-source LLM tracing & evals"},"phoenix":{"name":"Arize Phoenix","logo":"phoenix","cat":"Observability & evaluation","lic":"Open source","url":"https://phoenix.arize.com","what":"An open-source observability and evaluation tool for LLM apps from Arize, built on OpenTelemetry tracing.","short":"OTel-based LLM observability"},"wandb":{"name":"Weights & Biases","logo":"wandb","cat":"Observability & evaluation","lic":"Managed service","url":"https://wandb.ai","what":"An ML platform for experiment tracking; its Weave toolkit traces and evaluates LLM applications.","short":"Experiment tracking & Weave"},"nextjs":{"name":"Next.js","logo":"nextjs","cat":"Web framework","lic":"Open source","url":"https://nextjs.org","what":"A React framework by Vercel for full-stack web apps, with server rendering and streaming UI — common for chat front-ends.","short":"React full-stack framework"},"openaiagents":{"name":"OpenAI Agents SDK","logo":"openai","cat":"Agent framework","lic":"Open source (MIT)","url":"https://openai.github.io/openai-agents-python/","what":"OpenAI's lightweight Python and TypeScript SDK for agents: an agent loop with tools, handoffs between agents, input/output guardrails, sessions and built-in tracing. Works with OpenAI and oth ice for foundation models from Anthropic, Meta, Mistral, Amazon and others through one API, inside your AWS account (IAM, billing, private networking), with built-in Knowledge Bases (managed RAG) and Guardrails.","short":"Many foundation models via one AWS API"},"bedrockagents":{"name":"Amazon Bedrock Agents","logo":"bedrockagentcore","cat":"Agent framework","lic":"Managed service","url":"https://aws.amazon.com/bedrock/agents/","what":"Managed agents on Amazon Bedrock: an agent plans multi-step tasks, calls your APIs through action groups (Lambda functions or an OpenAPI schema) and searches Bedrock Knowledge Bases, with AWS running the orchestration loop, session memory and guardrails.","short":"Managed AWS agents with actions and knowledge bases"},"bedrockagentcore":{"name":"Amazon Bedrock AgentCore","logo":"bedrockagentcore","cat":"Agent framework","lic":"Managed service","url":"https://aws.amazon.com/bedrock/agentcore/","what":"AWS's platform for running agents in production with any framework or model: a serverless runtime with session isolation, memory, a gateway that turns APIs into MCP tools, identity, a code interpreter and browser, and observability.","short":"Production agent runtime and services on AWS"},"strands":{"name":"Strands Agents","logo":"strands","cat":"Agent framework","lic":"Open source","url":"https://strandsagents.com","what":"An open-source, model-driven agent SDK from AWS: give a model a prompt and tools, and it plans and calls tools in a loop. Works with Amazon Bedrock, Anthropic, OpenAI, Ollama and other providers, with MCP tools and multi-agent patterns.","short":"Model-driven open-source agent SDK (AWS)"}};

/* deep-dive content for the click cards */
const DEEP = {
  user: { deep:'An agent starts with a goal rather than a single question, and the user\'s role shifts from asking to delegating and supervising. Good agent UIs stream progress (plans, tool calls, intermediate results) so the user can follow along, interrupt or redirect, and they make it obvious when the agent is waiting for input or approval. The same agent may be reached from several surfaces (chat, an IDE, Slack, email or an API) sharing one identity and memory.',
    concepts:[['Goal vs. prompt','Describe the outcome and constraints, not every step.'],['Streaming','Show plans, tool calls and partial results as they happen.'],['Steering','Interrupt, correct or add information mid-run.'],['Identity','The agent acts on the user\'s behalf, with scoped permissions.']],
    inp:'A goal, constraints and attachments.', out:'Progress updates, approval requests and the final result.',
    tips:['Ask for clarification early instead of guessing on ambiguous goals.','Show what the agent is doing and why; trust comes from visibility.','Let users stop a run at any time.'] },
  triggers: { deep:'Background ("ambient") agents are started by events instead of people: a schedule, a webhook from another system, a new ticket or email, a failed CI job. The event becomes the task, often with a structured payload, and the result is delivered where people already work (a pull request, a comment, a Slack message) rather than as a chat reply. Because nobody watches these runs live, they lean heavily on guardrails, budgets, approvals and observability.',
    concepts:[['Schedule','Cron-style runs: daily reports, nightly triage.'],['Webhook','Another system pushes an event: issue opened, payment failed.'],['Queue','Events are buffered and processed with retries.'],['Idempotency','A repeated event must not trigger duplicate actions.']],
    inp:'An event payload (who, what, when).', out:'A new agent run with a task derived from the event.',
    tips:['De-duplicate events and make actions idempotent.','Set per-run budgets for tokens, time and tool calls.','Report results where people already work (Slack, PRs, tickets).'] },
  guard: { deep:'Agents read untrusted text (web pages, emails, tool results) and can take real actions, which makes prompt injection the defining risk: instructions hidden in content can hijack the agent. Defence is layered: classify inputs and outputs, treat tool results as data rather than instructions, give the agent only the privileges it needs (scoped, short-lived credentials), allow-list tools per task, and require approval for anything irreversible. Output checks catch leaked secrets, personal data and ungrounded claims.',
    concepts:[['Prompt injection','Instructions hidden in content the agent reads.'],['Least privilege','Only the tools and scopes this task needs.'],['Policy engine','Rules that allow, deny or escalate each tool call.'],['Output checks','PII, secrets, safety and grounding before anything is sent.']],
    inp:'User input, tool calls and the draft output.', out:'Allowed, blocked, redacted or escalated for approval.',
    tips:['Never let content from tools change the agent\'s permissions.','Separate read-only and write tools; gate the write ones.','Log every blocked or escalated action for review.'] },
  hitl: { deep:'Human-in-the-loop turns risky autonomy into supervised autonomy. When a policy flags an action (above a spending limit, touching production, contacting customers), the runtime checkpoints the run and sends an approval request with what a reviewer needs: what, why, and the exact action. The person can approve, edit the arguments or reject with feedback, and the run resumes from the checkpoint, minutes or days later.',
    concepts:[['Interrupt','Pause the run at a defined point and wait.'],['Checkpoint','Persisted state so the run can resume later.'],['Approve / edit / reject','Reviewers can change arguments, not just say yes or no.'],['Escalation','Route to the right person by risk or domain.']],
    inp:'A proposed action plus its justification.', out:'Approve, edit or reject, and the run resumes.',
    tips:['Show the exact action and its impact, not the whole transcript.','Approvals must survive restarts: use durable checkpoints.','Track approval rates: constant rubber-stamping means the policy is too broad.'] },
  context: { deep:'The context window is the agent\'s working memory. Each turn, the runtime rebuilds what the model sees from the system prompt, tool definitions, the current plan, relevant memories, retrieved knowledge and the latest observations. Long tasks quickly overflow it, so agents compact older steps into summaries, offload large results to files and pull details back in on demand. Choosing what goes in, and keeping the noise out, is called context engineering.',
    concepts:[['System prompt','Role, rules and how to use the tools.'],['Observation','A tool result appended after each action.'],['Compaction','Summarise old turns to free tokens.'],['Prompt caching','Reuse the stable prefix to cut cost and latency.']],
    inp:'Task, plan, memories, knowledge and tool results.', out:'The exact tokens the LLM reads this turn.',
    tips:['Keep stable content first so it can be cached.','Trim tool outputs: return what matters, not everything.','Write intermediate results to files or memory instead of the context.'] },
  ltm: { deep:'Long-term memory lets an agent improve across sessions instead of starting from zero. After a run, a memory step extracts what is worth keeping: facts about the user or project (semantic), what happened and how it went (episodic), and how to do recurring tasks (procedural). Before a run, relevant memories are retrieved into the context. Memories also need updating and forgetting, or they go stale and contradict each other. Many teams simply keep them in PostgreSQL with pgvector.',
    concepts:[['Semantic','Facts and preferences: "deploys go through GitHub Actions".'],['Episodic','Past runs and their outcomes.'],['Procedural','Learned instructions and playbooks.'],['Write policy','What to store, when to update, when to forget.']],
    inp:'Conversations and run transcripts.', out:'Relevant memories, retrieved into the context.',
    tips:['Store small, atomic facts with timestamps and sources.','Resolve conflicts: newer facts replace old ones.','Scope memories per user or tenant to avoid leaks.'] },
  knowledge: { deep:'Knowledge is the organisation\'s documents and data, indexed for search: the RAG pipeline, exposed to the agent as a tool. In agentic RAG the agent decides when to search, rewrites the query, inspects the results and searches again if they aren\'t good enough, possibly across several sources (vector DB, keyword search, SQL, a knowledge graph). Many teams use a database they already run: PostgreSQL with pgvector keeps text, embeddings and metadata side by side; dedicated vector databases take over at larger scale.',
    concepts:[['Vector search','Nearest neighbours in embedding space (HNSW indexes).'],['Hybrid search','Vectors for meaning plus keywords (BM25) for exact terms.'],['Metadata filters','Restrict by tenant, date or permissions.'],['Agentic retrieval','Search, judge, refine the query, search again.']],
    inp:'A search query from the agent, plus filters.', out:'Ranked passages with their sources.',
    tips:['Enforce document permissions in the filter, not in the prompt.','Return sources so answers can cite them.','Start with Postgres + pgvector; move to a dedicated vector DB when scale demands it.'],
    link:{ href:'index.html', text:'See the full RAG architecture ↗' } },
  llm: { deep:'The LLM is the policy that drives the loop: given the context, it decides the next action. Agent-grade models are trained for tool use (well-formed calls, several in parallel, recovering from errors) and many reason before acting with a thinking budget. Production agents often mix models: a frontier model for planning and hard steps, smaller fast models for sub-agents, classification and summaries.',
    concepts:[['Tool calling','Structured output naming a tool and its JSON arguments.'],['Parallel calls','Several independent tool calls in one turn.'],['Reasoning budget','Extra thinking tokens before answering or acting.'],['Model routing','Pick the model per step by difficulty and cost.']],
    inp:'The context window.', out:'A final answer, or one or more tool calls.',
    tips:['Measure tool-call accuracy, not just answer quality.','Set maximum steps and token budgets per run.','Use smaller models for sub-tasks; keep the big one for decisions.'] },
  planner: { deep:'Planning turns a fuzzy goal into ordered steps with clear completion criteria. Simple agents plan implicitly, one step at a time (ReAct). Harder tasks benefit from an explicit plan written into the context: a to-do list the agent ticks off and revises as it learns. Plans can also fan out, sending independent steps to sub-agents in parallel and merging their results at the end.',
    concepts:[['ReAct','Reason, act, observe: one step at a time.'],['Plan-and-execute','Write the plan first, then execute and re-plan.'],['Decomposition','Split into sub-tasks with clear done-criteria.'],['Re-planning','Update the plan when observations change the picture.']],
    inp:'The goal and the current state.', out:'An ordered plan / to-do list in the context.',
    tips:['Keep the plan visible to the user; it is the best progress indicator.','Re-plan after surprises instead of forcing the old plan.','Cap the depth: over-planning wastes tokens on simple tasks.'] },
  reflect: { deep:'Reflection adds a feedback loop on quality. After an action or a draft, a critic (the same model with a reviewer prompt, a different model, or a deterministic check such as a test suite) compares the result with the goal and lists problems. The agent fixes them and tries again, within a retry limit. Verifiable checks like tests, schemas and linters are the most reliable; LLM judges help where there is no ground truth.',
    concepts:[['Self-critique','Review your own output against the goal.'],['LLM-as-judge','A separate model scores or critiques the result.'],['Verify by execution','Run tests or queries to check the work.'],['Retry budget','Stop after N attempts and escalate.']],
    inp:'A result plus the goal and criteria.', out:'Pass, or a list of issues to fix.',
    tips:['Prefer executable checks over opinions when you can.','Give the critic explicit criteria, not "is this good?".','Limit retries to avoid loops that burn budget.'] },
  tools: { deep:'Tools are the agent\'s hands. Each one is described by a name, a description and a JSON Schema for its arguments, and the model chooses tools from these descriptions alone, so they must be precise. The runtime validates the arguments, checks the policy, executes the call (sometimes several in parallel) and returns a concise result. Errors are returned as observations too, so the model can correct itself. Sub-agents are often exposed as just another tool.',
    concepts:[['Tool schema','Name, description and JSON Schema arguments.'],['Validation','Reject malformed or out-of-policy calls before running them.'],['Observation','The trimmed result fed back to the model.'],['Tool choice','Let the model decide, force a tool, or forbid tools.']],
    inp:'A tool call from the LLM.', out:'A result or an error, appended to the context.',
    tips:['Fewer, well-designed tools beat many overlapping ones.','Return errors the model can act on ("date must be ISO-8601").','Make tools idempotent where possible; agents retry.'] },
  mcp: { deep:'The Model Context Protocol (MCP) is an open standard for connecting AI applications to tools and data. An MCP server exposes tools (actions), resources (data) and prompts; any MCP client, whether an IDE, a chat app or your own agent, can discover and use them. Servers run locally over stdio or remotely over HTTP with OAuth, so the same GitHub, database or Slack integration works across agents instead of being rebuilt for each one.',
    concepts:[['Server','Exposes tools, resources and prompts.'],['Client','The agent host that connects to servers.'],['Transports','stdio for local, streamable HTTP for remote.'],['Auth','OAuth for remote servers; scope what each one can do.']],
    inp:'Tool calls routed to a server.', out:'Results from the underlying system.',
    tips:['Only connect servers you trust: tool descriptions become part of the prompt.','Limit how many tools are loaded at once; too many confuse the model.','Pin server versions and review permissions like any dependency.'] },
  code: { deep:'A code sandbox gives the agent a computer of its own: a short-lived, isolated environment (microVM or container) with a filesystem, a shell and common runtimes. The agent writes code, runs it, reads the output and iterates, to analyse data, reproduce bugs, run tests or produce files. Isolation makes this safe: no production credentials, restricted network, CPU and time limits, and a fresh environment per task.',
    concepts:[['Isolation','MicroVMs or containers, separate from your infrastructure.'],['Ephemeral','Created per task, destroyed afterwards.'],['Code as action','Agents can act by writing code instead of single tool calls.'],['Artifacts','Files and charts the agent produces and returns.']],
    inp:'Code or shell commands from the agent.', out:'stdout/stderr, exit codes and files.',
    tips:['Never mount production secrets into a sandbox.','Restrict outbound network to what the task needs.','Set timeouts: agents write infinite loops too.'] },
  browser: { deep:'Browser agents operate websites the way people do, for the many tasks with no API. The runtime controls a real (often headless) browser and gives the model a view of the page (an accessibility tree, the DOM or screenshots), and the model picks the next action: click, type, scroll, navigate. "Computer use" generalises this to whole desktops through screenshots and mouse and keyboard actions. It is powerful but slower and more brittle than APIs, so prefer APIs when they exist.',
    concepts:[['Accessibility tree','A structured page snapshot: cheaper and more reliable than pixels.'],['Computer use','Screenshots in, mouse and keyboard actions out.'],['Session','Cookies and logins for the agent\'s own browser.'],['Site rules','Sites may block automation; respect their terms.']],
    inp:'A navigation goal and actions.', out:'Page content, extracted data, screenshots.',
    tips:['Use APIs when available; the browser is the fallback.','Give the agent its own accounts, never a person\'s session.','Record sessions for debugging and audit.'] },
  apis: { deep:'Business systems are where agent actions become real: opening pull requests, updating tickets, sending messages, refunding payments, changing CRM records. Integrations come through vendor APIs, MCP servers or integration platforms. Because these actions have side effects they need the strongest controls: scoped credentials per agent, idempotency keys, rate limits, audit logs, approvals for anything irreversible, and clear attribution of what the agent did.',
    concepts:[['Side effects','Actions that change the world and may not be undoable.'],['Scopes','Fine-grained permissions per agent and task.'],['Idempotency key','Prevents duplicate actions on retry.'],['Audit log','Who or what did what, when, and why.']],
    inp:'Validated API calls.', out:'Changed records, new pull requests, sent messages.',
    tips:['Give agents their own service identities.','Prefer reversible actions (drafts, PRs) over direct changes.','Rate-limit writes per run.'] },
  subagents: { deep:'Multi-agent systems split work between specialists. In the common orchestrator-worker pattern, the main agent delegates a sub-task to a sub-agent with its own prompt, tools and a fresh context window; the sub-agent explores freely and returns only a compact result. This keeps the main context clean and allows parallel work, at the cost of more tokens and coordination. Handoffs are the other pattern: control passes to another agent, which then continues the conversation itself.',
    concepts:[['Orchestrator-worker','A lead agent delegates and merges results.'],['Handoff','Transfer the conversation to a specialist.'],['Context isolation','Each sub-agent starts with a fresh, focused context.'],['Parallelism','Independent sub-tasks run at the same time.']],
    inp:'A self-contained sub-task with instructions.', out:'A concise result or report.',
    tips:['Give sub-agents complete, self-contained instructions.','Use multiple agents only when work parallelises; it multiplies cost.','Have sub-agents return summaries, not transcripts.'] },
  a2a: { deep:'Agent-to-agent protocols let agents built by different teams, vendors or frameworks work together without sharing code. With the Agent2Agent (A2A) protocol, a remote agent publishes an Agent Card describing its skills and endpoint; a client agent sends it a task over HTTP (JSON-RPC), receives streamed updates for long-running work, and gets artifacts back. MCP connects agents to tools; A2A connects agents to other agents.',
    concepts:[['Agent Card','Public description of an agent\'s skills and endpoint.'],['Task','The unit of work, with a lifecycle and status updates.'],['Artifacts','Results returned by the remote agent.'],['Opaque agents','Collaborate without exposing internal prompts or tools.']],
    inp:'A task for a remote agent.', out:'Status updates and result artifacts.',
    tips:['Authenticate both sides; treat remote agents as untrusted input.','Define clear contracts for what each agent may be asked to do.','Trace across agent boundaries with shared trace IDs.'] },
  obs: { deep:'Agents are non-deterministic and take many steps, so they cannot be debugged from the final answer alone. Tracing records every run as a tree of spans (model calls with prompts and tokens, tool calls with arguments and results, sub-agents, approvals) with latency and cost. Evaluations then score runs: offline on test suites before a release, and online on production traffic, using task success, tool-call accuracy, trajectory checks and LLM judges.',
    concepts:[['Trace & span','A run and each of its steps, nested.'],['Trajectory eval','Was the sequence of steps sensible, not just the answer?'],['Online evals','Score live traffic to catch regressions.'],['Cost per task','Tokens, tools and compute per completed goal.']],
    inp:'Spans from every component.', out:'Dashboards, alerts, eval scores and datasets.',
    tips:['Instrument from day one; retrofitting traces is painful.','Turn production failures into regression test cases.','Track success rate and cost together.'] },
  loop: { deep:'The agent loop is the small program that makes an LLM agentic: build the context, call the model, execute any tool calls, append the results and repeat until the model gives a final answer or a limit is hit. Around that core, the runtime manages state and checkpoints, step and budget limits, streaming, interrupts for approvals, retries and error handling. Agent frameworks provide this runtime; durable-execution engines let long runs survive crashes and deploys.',
    concepts:[['Observe → think → act','One iteration of the loop.'],['Stop conditions','Final answer, max steps, budget, or a human interrupt.'],['State & checkpoints','Persisted after each step so runs can resume.'],['Durable execution','Retries and resumption across crashes and deploys.']],
    inp:'A task.', out:'A finished result, an approval request or an error.',
    tips:['Always set maximum steps, timeouts and a token budget.','Checkpoint after each step: long runs will be interrupted.','Start with a single agent and a good loop before going multi-agent.'] },
};

{
