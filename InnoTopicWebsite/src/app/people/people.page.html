<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>people</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">people</ion-title>
    </ion-toolbar>
  </ion-header>


  <h1>TODO:  Jay: ion-grid or something, with cards :)</h1>
  <p>Ofcource fully theme-able and responsive :)</p>

  <ion-card *ngFor="let person of peopleArray">
    <ion-card-header>
      <ion-card-title>
        <a href="p/{{ person.id }}">
          {{ person.fullName }}
        </a>

        </ion-card-title>
      <ion-card-subtitle>
        <strong>
          <app-hashtag-replacer [text]="person.position" />
        </strong>
          at {{person.company}}
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <app-hashtag-replacer [text]="person.tagline" />

      TODO: BIO
      TODO: natural languages
      TODO: skills
      ALl components (but separate components from `-section` component)

    </ion-card-content>
  </ion-card>

</ion-content>
