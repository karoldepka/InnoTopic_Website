<ng-container *ngIf="!isLoading; else loader">
  <ion-grid>
    <ion-row>
      <ion-col size="6" size-md="4" size-lg="3" *ngFor="let item of promptResult">
        @if(isCustomAI) {
          <pre>{{item}}</pre>
          <img height="100" width="100" src="assets/logos/logos/{{item}}" [alt]="item" />
        } @else {
          <app-preview [item]="item" />
        }
      </ion-col>
    </ion-row>
  </ion-grid>
</ng-container>

<ng-template #loader>
  <div class="loader">
    <ion-spinner/>
  </div>
</ng-template>
