<ng-container *ngIf="!isLoading; else loader">
  <ion-grid>
    <ion-row>
      @for (item of promptResult; track item) {
        <ion-col size="6" size-md="4" size-lg="3">
          @if(isCustomAI) {
            <pre>{{item}}</pre>
            <img height="100" width="100" loading="lazy" decoding="async" src="assets/logos/logos/{{item}}" [alt]="item" />
          } @else {
            <app-preview [item]="item" />
          }
        </ion-col>
      }
    </ion-row>
  </ion-grid>
</ng-container>

<ng-template #loader>
  <div class="loader">
    <ion-spinner/>
  </div>
</ng-template>
