<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <app-company-logo></app-company-logo>
    </ion-buttons>

    <ion-title></ion-title>
    <ion-buttons slot="end">
      <span routerLink="/chat" class="clickable" style="margin-right: 15px;">AI CHAT</span>
      <span (click)="showThemeConfig = !showThemeConfig" class="clickable">THEME</span>
    </ion-buttons>
    @if (showThemeConfig) {
      @defer {
        <app-theme-config />
      } @placeholder {
        <div class="theme-config-placeholder" aria-hidden="true"></div>
      }
    }
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <app-cv-page />
</ion-content>
