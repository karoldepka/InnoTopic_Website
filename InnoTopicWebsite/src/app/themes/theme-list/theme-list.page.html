<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button mode="md" [defaultHref]="'/'"></ion-back-button>
    </ion-buttons>
    <ion-title>Themes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="theme-list-page container">
    <h1 class="section-title">Themes</h1>
    <p>
      Pick a ready-made theme below, or fine-tune every color and shadow yourself on the
      <a routerLink="/theme-demo">Theme Preferences</a> page.
    </p>

    <theme-selector></theme-selector>
  </div>
</ion-content>
