<div class="world-map">
  <svg class="map-svg" [attr.viewBox]="'0 0 ' + width + ' ' + height" role="group" aria-label="World map of the cities Karol has worked in or with">
    <defs>
      <pattern [attr.id]="ids.texture" width="3" height="3" patternUnits="userSpaceOnUse">
        <circle class="texture-dot" cx="1.5" cy="1.5" r="0.3" />
      </pattern>
      <!-- The land's own texture: fine diagonal hatching, shown only on the land through its mask. -->
      <pattern [attr.id]="ids.landTexture" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line class="land-texture-line" x1="0" y1="0" x2="0" y2="2.4" />
      </pattern>
      <!-- An alpha mask: wherever the land is drawn (opaque), the texture shows. -->
      <mask [attr.id]="ids.landMask" class="land-mask" maskUnits="userSpaceOnUse" x="0" y="0" [attr.width]="width" [attr.height]="height">
        <use [attr.href]="'#' + ids.land" />
      </mask>
      <!-- Markers keep the original art's light-to-dark gradient, built from the secondary color. -->
      <linearGradient [attr.id]="ids.marker">
        <stop offset="0" class="marker-light" />
        <stop offset="1" class="marker-dark" />
      </linearGradient>
    </defs>

    <rect class="texture" [attr.width]="width" [attr.height]="height" [attr.fill]="'url(#' + ids.texture + ')'" />
    <path class="graticule" [attr.d]="graticule" />
    <g appWorldMapLand [attr.id]="ids.land"></g>
    <rect class="land-texture" [attr.width]="width" [attr.height]="height" [attr.fill]="'url(#' + ids.landTexture + ')'" [attr.mask]="'url(#' + ids.landMask + ')'" />

    @for (city of cities; track city.label) {
      <g
        class="marker"
        [class.marker--active]="active() === city"
        tabindex="0"
        role="img"
        [attr.aria-label]="city.label"
        (pointerenter)="onPointerEnter(city, $event)"
        (pointerleave)="onPointerLeave($event)"
        (click)="select(city, $event)"
        (focus)="active.set(city)"
        (blur)="active.set(undefined)"
      >
        <!-- A larger, invisible target than the dot itself. -->
        <circle class="marker-hit" [attr.cx]="city.x" [attr.cy]="city.y" r="3.5" />
        <circle class="marker-dot" [attr.cx]="city.x" [attr.cy]="city.y" r="1.85" [attr.fill]="'url(#' + ids.marker + ')'" />
      </g>
    }
  </svg>

  @if (active(); as city) {
    <div
      class="world-map-tooltip"
      [class.world-map-tooltip--start]="city.align === 'start'"
      [class.world-map-tooltip--end]="city.align === 'end'"
      [class.world-map-tooltip--below]="city.below"
      [style.left.%]="city.left * 100"
      [style.top.%]="city.top * 100"
      role="tooltip"
    >
      <strong>{{ city.name }}</strong> <span class="world-map-tooltip-country">{{ city.country }}</span>
      @if (city.organisations.length) {
        <div class="world-map-tooltip-orgs">{{ city.organisations.join(' · ') }}</div>
      }
    </div>
  }
</div>
