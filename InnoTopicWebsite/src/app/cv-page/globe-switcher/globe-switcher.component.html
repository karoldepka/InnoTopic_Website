<div class="globe-switcher">
  <div class="switcher-tabs">
    @for (m of modes; track m.key) {
      <button
        [class.active]="activeMode === m.key"
        (click)="setMode(m.key)"
        class="tab-btn"
        [disabled]="loadingMode === m.key"
        [title]="m.tech"
      >{{ m.label }}</button>
    }
  </div>

  <div class="globe-viewport">
    @if (activeComponent) {
      <ng-container *ngComponentOutlet="activeComponent" />
    } @else {
      <div class="globe-mode-placeholder" aria-hidden="true"></div>
    }
  </div>

  <div class="tech-label">{{ activeTech }}</div>
</div>
