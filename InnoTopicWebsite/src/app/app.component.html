<ng-container *ngIf="! isPrint">
  <ion-app>
    <ion-router-outlet id="main-content" />
  </ion-app>
</ng-container>

<ng-container *ngIf="isPrint && printPageComponent">
  <main class="print-page-screen-scroll">
    <ng-container *ngComponentOutlet="printPageComponent" />
  </main>
</ng-container>
