<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- "Start time tracking" icon: a solid disc (matching the app's solid Ionicons style) with the
       clock hands boolean-subtracted out of it, so they show through as the background. -->
  <mask id="timeTrackStartClockHandsCutout" maskUnits="userSpaceOnUse">
    <rect x="0" y="0" width="48" height="48" fill="#fff"/>
    <line x1="24" y1="24" x2="24" y2="10" stroke="#000" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="24" x2="33" y2="24" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  </mask>
  <circle cx="24" cy="24" r="22" fill="currentColor" mask="url(#timeTrackStartClockHandsCutout)"/>
</svg>
