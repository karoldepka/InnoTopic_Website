<app-time-tracking-toolbar
  style="font-size: 13px"
></app-time-tracking-toolbar>

@if (voiceMemoService.isRecordingAnywhere$ | async) {
  <ion-button
    fill="clear"
    size="small"
    class="recording-indicator"
    title="Recording in progress somewhere in the app - tap to go to it"
    (click)="navigateToActiveRecording()"
    aria-label="Recording in progress. Open active recording"
  >
    <span class="recording-dot" aria-hidden="true"></span>
    REC
  </ion-button>
}

@if (voiceMemoService.isPlayingAnywhere$ | async) {
  <span
    class="playing-indicator"
    title="A voice memo is playing somewhere in the app"
    role="status"
    aria-label="A voice memo is playing"
  >
    <ion-icon name="play" aria-hidden="true"></ion-icon>
  </span>
}

@if (! (inQuiz$ | async)) {
  <app-voice-memo-field
    [fieldId]="'note'"
    [createItemIfMissing]="createQuickRecordItem"
    [alwaysCreateNewItemOnRecord]="true"
    (transcriptReady)="onQuickRecordTranscriptReady($event)"
    title="Quick voice note - saved as a new item, not attached to whatever page you're on"
  ></app-voice-memo-field>
}

<ion-button
  class="theme-button"
  fill="clear"
  size="small"
  (click)="openThemeConfig($event)"
  title="Theme"
>
  <ion-icon name="color-palette-outline" slot="icon-only"></ion-icon>
</ion-button>
