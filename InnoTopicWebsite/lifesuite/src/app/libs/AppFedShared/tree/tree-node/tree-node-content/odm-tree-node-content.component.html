<div
  class="tree-node-content"
  (keydown.arrowleft)="onArrowLeft()"
  (keydown.alt.arrowleft)="onArrowLeft()"
  (keydown.meta.arrowleft)="onArrowLeft()"
  (keydown.control.a)="this.toggleShowAnswer()"
  (keydown.control.arrowup)="reorderUp($event)"
  (keydown.control.arrowdown)="reorderDown($event)"
  (keydown.tab)="indentIncrease($event)"
  (keydown.shift.tab)="indentDecrease($event)"
>
  <ion-button
    fill="clear"
    size="small"
    class="node-icon-button"
    title="Expand or collapse"
    aria-label="Expand or collapse"
    (click)="treeNode.isExpanded = ! treeNode.isExpanded"
  >
    <ion-icon
      slot="icon-only"
      [name]="treeNode.isExpanded ? 'chevron-down' : 'chevron-forward'"
    />
  </ion-button>

  <ion-button
    fill="clear"
    size="small"
    class="node-icon-button"
    title="Move up (Ctrl+↑)"
    aria-label="Move up"
    (click)="reorderUp($event)"
  >
    <ion-icon slot="icon-only" name="arrow-up" />
  </ion-button>

  <ion-button
    fill="clear"
    size="small"
    class="node-icon-button"
    title="Move down (Ctrl+↓)"
    aria-label="Move down"
    (click)="reorderDown($event)"
  >
    <ion-icon slot="icon-only" name="arrow-down" />
  </ion-button>

  <ion-button
    fill="clear"
    size="small"
    class="node-icon-button"
    title="Indent - nest under previous sibling (Tab)"
    aria-label="Indent"
    (click)="indentIncrease($event)"
  >
    <ion-icon slot="icon-only" name="arrow-forward" />
  </ion-button>

  <ion-button
    fill="clear"
    size="small"
    class="node-icon-button"
    title="Outdent - become a sibling of the parent (Shift+Tab)"
    aria-label="Outdent"
    (click)="indentDecrease($event)"
  >
    <ion-icon slot="icon-only" name="arrow-back" />
  </ion-button>

  <ion-button
    *ngIf="isLearnItem"
    fill="clear"
    size="small"
    class="node-icon-button"
    title="Node actions"
    aria-label="Node actions"
    (click)="onClickClassIcon($event)"
  >
    <ion-icon
      slot="icon-only"
      name="ellipsis-horizontal-circle"
    />
  </ion-button>

  <ion-button
    *ngIf="isLearnItem"
    fill="clear"
    size="small"
    class="node-icon-button"
    title="Show or hide answer"
    aria-label="Show or hide answer"
    [color]="showAnswer ? 'primary' : 'medium'"
    (click)="toggleShowAnswer()"
  >
    <ion-icon
      slot="icon-only"
      name="chatbubble-ellipses"
    />
  </ion-button>
  <!--  (public)-->

  <app-rich-text-edit-cell
    #titleCell
    class="tree-title-cell"
    [cell]="mapColumnIdToCell.get('title')!"
  ></app-rich-text-edit-cell>

  <app-voice-memo-field
    [item$]="treeNode.item$"
    [fieldId]="'note'"
  ></app-voice-memo-field>

  <!--  <ion-button size="small">Add to my categories-->
<!--    &lt;!&ndash; bookmark icon like in LinkedIn Learning &ndash;&gt;-->
<!--  </ion-button>-->

<!--  Title: {{(val$ | async)?.title}}-->
<!--  Answer: {{(val$ | async)?.answer}}-->

<!--  <app-tree-node-cells-->
<!--    [treeNode]="treeNode"-->
<!--  >-->
<!--  </app-tree-node-cells>-->

</div>

<app-rich-text-edit-cell
  *ngIf="isLearnItem"
  #answerCell
  [hidden]="((! showAnswer) && !((val$ | async)?.answer)) || (!treeNode.isExpanded)"
  class="tree-answer-cell"
  [cell]="mapColumnIdToCell.get('answer')!"
></app-rich-text-edit-cell>
