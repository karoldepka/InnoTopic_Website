
<div *ngIf="item$ else noItem">


  <app-breadcrumbs
    *ngIf="! (itemVal$ | async)?.hideAncestorsInQuiz"
    [item$]="item$"
   />

  <app-item-side-editor
    [item$]="item$ !"
    [side]="$safeNavigationMigration((itemVal$ ! | async) ?. getSideWithQuestionOrFirstNonEmpty())"
    [showMic]="false"
    [showAiFillButton]="false"
   />

  <div
    #answers
    style="border: 3px var(--answerBorderColor) solid; border-radius: 6px; padding: 6px"
    *ngIf="(showHint$ | async) || (showChoices$ | async) || (showAnswer$ | async)"
  >
    <ng-container
      *ngIf="(showHint$ | async)"
    >
      <app-item-side-editor
        *ngFor="let hintSide of getVisibleHintSides((itemVal$ | async), (showHint$ | async))"
        [item$]="item$ !"
        [side]="hintSide"
        [showMic]="false"
        [showAiFillButton]="false"
       />
    </ng-container>

    <div
      *ngIf="getMultipleChoiceAnswers(itemVal$ | async).length && ((showChoices$ | async) || (showAnswer$ | async))"
      style="display: grid; gap: 0.4rem"
    >
      <button
        type="button"
        *ngFor="let choice of getMultipleChoiceAnswers(itemVal$ | async)"
        class="abcd-answer"
        (click)="onAbcdChoiceClick()"
        [attr.aria-pressed]="showAnswer$ | async"
        [class.abcd-answer--incorrect-revealed]="(showAnswer$ | async) && !choice.correct"
        [style.border-color]="(showAnswer$ | async) && choice.correct ? 'var(--ion-color-success)' : null"
      >
        <strong>{{ choice.label }}.</strong> {{ choice.text }}
      </button>
    </div>

    <ng-container *ngIf="showAnswer$ | async">
      <ng-container *ngFor="let answerSide of (itemVal$ | async) ?. getSidesWithAnswers()">
      <!--      <hr>-->
<!--      <app-side-label-->
<!--        *ngIf="(showHint$ | async) && ! (showAnswer$ | async)"-->
<!--        [side]="answerSide"-->
<!--      ></app-side-label>-->

      <app-item-side-editor
        [item$]="item$ !"
        [side]="answerSide"
        [showRevealButton]="! (showAnswer$ | async)"
        [showMic]="false"
        [showAiFillButton]="false"
       />

      </ng-container>
    </ng-container>
  </div>


  <app-tree
    *ngIf="(showAnswer$ | async) && (item$?.childrenList$ | async)?.length"
    [rootItem]="item$!"
  />

<!--  <app-show-answer-and-rate-->
<!--  ></app-show-answer-and-rate>-->

</div>

<ng-template #noItem>
  <div style="margin: 1rem; display: flex; align-items: center; gap: 0.5rem">
    {{ quizLoaded ? 'No quiz item' : 'Loading Quiz...' }}
    <ion-button size="small" (click)="loadAll()">Load All</ion-button>
  </div>
</ng-template>
