<ion-content class="ion-padding">
  <h3>Get AI advice</h3>

  <ion-item lines="none">
    <ion-label position="stacked">Max days of history</ion-label>
    <ion-input type="number" min="1" inputmode="numeric" [formControl]="formControls.maxDaysHistory"></ion-input>
  </ion-item>

  <ion-item lines="none">
    <ion-label position="stacked">Max journal entries of history</ion-label>
    <ion-input type="number" min="1" inputmode="numeric" [formControl]="formControls.maxEntriesHistory"></ion-input>
  </ion-item>

  <ion-button *ngIf="!adviceLoading()" expand="block" (click)="getAdvice()">
    {{ messages().length ? 'Start over' : 'Get AI advice' }}
  </ion-button>
  <ion-button *ngIf="adviceLoading()" expand="block" color="medium" (click)="stopAdvice()">
    <ion-spinner name="dots"></ion-spinner>
    &nbsp;Stop
  </ion-button>

  <p *ngIf="adviceError()" class="journal-ai-advice__error">{{ adviceError() }}</p>

  <div class="journal-ai-advice__thread" *ngIf="messages().length">
    <div
      *ngFor="let message of messages()"
      class="journal-ai-advice__message"
      [ngClass]="'journal-ai-advice__message--' + message.role"
    >{{ message.content }}</div>
  </div>

  <ion-item lines="none" *ngIf="messages().length" class="journal-ai-advice__reply">
    <ion-input
      placeholder="Reply..."
      [formControl]="replyControl"
      [disabled]="adviceLoading()"
      (keyup.enter)="sendReply()"
    ></ion-input>
    <ion-button slot="end" fill="clear" [disabled]="adviceLoading()" (click)="sendReply()">Send</ion-button>
  </ion-item>

  <ng-container *ngIf="recentAdvice$ | async as recentAdvice">
    <h3 *ngIf="recentAdvice.length" class="journal-ai-advice__history-heading">Past advice</h3>
    <div *ngFor="let item$ of recentAdvice" class="journal-ai-advice__result journal-ai-advice__history-item">
      <div class="journal-ai-advice__history-when">{{ item$.val?.whenCreated | odmDate | date:'short' }}</div>
      {{ item$.val?.advice }}
    </div>
  </ng-container>
</ion-content>
