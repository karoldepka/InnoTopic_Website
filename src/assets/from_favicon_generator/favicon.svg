<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LifeSuite favicon">
  <defs>
    <!-- Dark navy background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0e1d2e"/>
      <stop offset="100%" stop-color="#1a3050"/>
    </linearGradient>
    <!-- Light blue cloud: bright top-left → deeper blue -->
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%"   stop-color="#c8f0ff"/>
      <stop offset="58%"  stop-color="#6dd4ff"/>
      <stop offset="100%" stop-color="#3aaceb"/>
    </linearGradient>
    <!-- Orange L: warm amber → deep orange -->
    <linearGradient id="letterGrad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#ffde90"/>
      <stop offset="55%"  stop-color="#ff8a00"/>
      <stop offset="100%" stop-color="#e06000"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background (100% of viewBox) -->
  <rect width="64" height="64" fill="url(#bgGrad)"/>

  <!--
    Original logo paths are in a 86×76 coordinate space.
    Scale = 56/86 ≈ 0.6512 → rendered width = 56 px (4 px left margin, 4 px right margin).
    Rendered height = 75.5 × 0.6512 ≈ 49.2 px → centred vertically:
      y offset = 4 + (56 − 49.2) / 2 ≈ 7.4 px  (top ≈ 7.4 px, bottom ≈ 7.4 px)
    All geometry ≥ 4 px from every canvas edge.
  -->
  <g transform="translate(4,7.4) scale(0.6512)">
    <path fill="url(#cloudGrad)"
      d="M30.5938,0c-4.3978,0-8.0456,3.01526-9.0899,7.08953-.1176,0-.2059-.02942-.3236-.02942-5.1921,0-9.4134,4.22139-9.4134,9.41349c0,.706.0882,1.3973.25,2.0592-4.2949,1.765-7.31016,5.9717-7.31016,10.8843c0,1.8533.47067,3.5742,1.22081,5.1333C2.3975,36.5802,0,40.3456,0,44.714c0,4.898,3.00055,9.1046,7.26603,10.8697-.13238.6766-.20592,1.3679-.20592,2.0739c0,5.854,4.73619,10.5901,10.59019,10.5901.603,0,1.1914-.0735,1.765-.1765c1.412,4.192,5.3245,7.2366,10.0018,7.2366c5.854,0,10.5902-4.7361,10.5902-10.5901v-55.30422C40.0073,4.22136,35.7859,0,30.5938,0Z"/>
    <path fill="url(#letterGrad)"
      transform="translate(-0.21686,0)"
      d="M52.4215,64.2472c-.9946,0-1.8009-.8063-1.8009-1.8009v-53.29442c0-.99461.8063-1.8009,1.8009-1.8009h7.4569c.9946,0,1.8009.80629,1.8009,1.8009v43.59802c0,.9946.8063,1.8009,1.8009,1.8009h20.0045c.9946,0,1.8009.8063,1.8009,1.8009v6.0946c0,.9946-.8063,1.8009-1.8009,1.8009h-31.0632Z"/>
  </g>
</svg>
