<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- "Start time tracking" icon: a solid record-style circle with a clock face boolean-subtracted
       out of the middle - the hands stay solid (not subtracted), bridging across the cut-out like a
       stencil, so the clock reads clearly rather than just looking like a plain ring. -->
  <mask id="timeTrackStartClockCutout" maskUnits="userSpaceOnUse">
    <rect x="0" y="0" width="48" height="48" fill="#fff"/>
    <circle cx="24" cy="24" r="13" fill="#000"/>
    <line x1="24" y1="24" x2="24" y2="15" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="24" x2="30" y2="24" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="1.8" fill="#fff"/>
  </mask>
  <circle cx="24" cy="24" r="22" fill="currentColor" mask="url(#timeTrackStartClockCutout)"/>
</svg>
