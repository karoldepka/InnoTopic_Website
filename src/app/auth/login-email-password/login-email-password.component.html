<form #g="ngForm">
  <ion-item>
    <ion-label position="floating">E-mail</ion-label>
    <ion-input type="email" ngModel name="email" [required]="true" email></ion-input>
  </ion-item>
  <ion-item>
    <ion-label position="floating">Password</ion-label>
    <ion-input [type]="showPassword ? 'text' : 'password'" ngModel name="password" [minlength]="8"></ion-input>
  </ion-item>
  <ion-item lines="none">
    <ion-checkbox labelPlacement="end" [(ngModel)]="showPassword" name="showPassword">
      Show password
    </ion-checkbox>
  </ion-item>
  <ion-button (click)="loginEmailAndPassword(g)" type="submit" color="primary" expand="block" [disabled]="!g.valid">
    Login</ion-button>
</form>

<ion-button
  fill="outline"
  color="danger"
  expand="block"
  (click)="loginViaGoogle()"
  [disabled]="isGoogleInProgress || isFacebookInProgress">
  <ion-icon *ngIf="!isGoogleInProgress" slot="start" name="logo-google"></ion-icon>
  <ion-spinner *ngIf="isGoogleInProgress" slot="start"></ion-spinner>
  {{ isGoogleInProgress ? 'Connecting Google...' : 'Continue with Google' }}
</ion-button>

<ion-button
  fill="outline"
  color="primary"
  expand="block"
  (click)="loginViaFacebook()"
  [disabled]="isGoogleInProgress || isFacebookInProgress">
  <ion-icon *ngIf="!isFacebookInProgress" slot="start" name="logo-facebook"></ion-icon>
  <ion-spinner *ngIf="isFacebookInProgress" slot="start"></ion-spinner>
  {{ isFacebookInProgress ? 'Connecting Facebook...' : 'Continue with Facebook' }}
</ion-button>
