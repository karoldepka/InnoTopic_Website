<ion-range
  [step]="0.2"
  (ionChange)="onSliderChange($event)"
></ion-range>
<div class="theme-id">{{ themeService.theme.id }}</div>
<ion-button size="small" (click)="themeService.applyRandomTheme()">Random Theme</ion-button>
<ion-button size="small" fill="outline" (click)="themeService.applyNextTheme()">Next Theme</ion-button>
<ion-button size="small" fill="outline" (click)="themesVisible = ! themesVisible">Themes</ion-button>
<div *ngIf="themesVisible">
  <div *ngFor="let curTheme of themes"
       style="cursor: pointer; margin-bottom: 4px"
       (click)="themeService.setTheme(curTheme)"
       [ngStyle]="{'background-color': curTheme.background}"
  >
    {{getThemeId(curTheme)}}<br>
    <span [ngStyle]="{color: curTheme.primary}">Primary</span>
    &nbsp;
    <span [ngStyle]="{color: curTheme.secondary}">Secondary</span>

  </div>
</div>
