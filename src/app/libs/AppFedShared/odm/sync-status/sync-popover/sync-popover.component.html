<h4
>
  <!--  //  (click)="logIn()"-->

  App & Sync Status
</h4>
<div class="expandable-section">
  <button class="expand-toggle" (click)="aboutAppExpanded = !aboutAppExpanded">
    About App <ion-icon [name]="aboutAppExpanded ? 'chevron-up' : 'chevron-down'" style="vertical-align: middle; font-size: 14px"></ion-icon>
  </button>
  <app-about-app *ngIf="aboutAppExpanded"></app-about-app>
</div>
<!-- TODO config component -->
<app-feature-config></app-feature-config>
<app-theme-config></app-theme-config>

<p>
  {{(authUser$ | async)?.email}}
</p>

<div
  *ngIf="(authUser$ | async) else notLoggedIn"
>
  <ng-container
    *ngIf="(syncStatus$ | async)?.pendingUploadsCount let count; else allUploaded"
  >
    To upload: {{count}}
    <ul>
      <li *ngFor="let description of pendingUploadDescriptions(syncStatus$ | async)">
        {{description}}
      </li>
    </ul>

  </ng-container>

  <ng-container
    *ngIf="(syncStatus$ | async)?.pendingDownloadsCount let count; else allDownloaded"
  >
    Downloading: {{count}} collections: {{toArray($safeNavigationMigration((syncStatus$ | async)?.pendingDownloads)) | json}}
  </ng-container>

  <ng-template
    #allUploaded
  >
    <p>All uploaded!</p>
  </ng-template>

  <ng-template
    #allDownloaded
  >
    <p>All downloaded!</p>
  </ng-template>

</div>

<ng-template
  #notLoggedIn
>
  Not logged in.
</ng-template>

<div class="actions">
  <ion-button size="small" (click)="logIn()">Log In</ion-button>
  <ion-button size="small" fill="outline" (click)="logOut()">Log Out</ion-button>
  <ion-button size="small" fill="outline" (click)="openOptions()">Options</ion-button>
</div>
