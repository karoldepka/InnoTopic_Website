<div class="comment-thread">
  @if (comments$ | async; as comments) {
    <div class="comment-thread__list">
      @for (comment of comments; track comment.id) {
        <div class="comment-thread__item">
          <div class="comment-thread__text">{{ comment.text }}</div>
          <div class="comment-thread__when">{{ comment.whenCreated | odmDate | date:'short' }}</div>
        </div>
      }
    </div>
  }

  <div class="comment-thread__add">
    <ion-textarea
      [(ngModel)]="newCommentText"
      placeholder="Add a comment…"
      [autoGrow]="true"
      rows="1"
      (keydown.enter)="onTextareaEnter($any($event))"
    ></ion-textarea>
    <ion-button
      fill="clear"
      size="small"
      (click)="submitComment()"
      [disabled]="!newCommentText.trim()"
    >
      <ion-icon name="send-outline" slot="icon-only"></ion-icon>
    </ion-button>
  </div>
</div>
