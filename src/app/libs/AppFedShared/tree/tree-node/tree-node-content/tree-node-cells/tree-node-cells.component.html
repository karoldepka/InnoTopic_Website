<!-- Have cells-list component be nestable for sub-cells -->

<!-- individual cell components MUST NOT assume they are in a tree node
  They could be in properties sheet or in options popup, etc.
  So they must be in separate module(s)

  Cell MUST NOT assume that it has anything to do with columns.
-->

@for (entry of cells; track entry.descriptor.id) {
  @if (isBareSlotCompact(entry.descriptor)) {
    <button
      type="button"
      class="slot-cell slot-cell--compact"
      (click)="expandBareSlot(entry.descriptor.id)"
    >
      <app-slot-icon [descriptor]="entry.descriptor"></app-slot-icon>
      {{ entry.descriptor.label }}
    </button>
  } @else {
  <div class="slot-cell">
    <div class="slot-cell__label">
      <app-slot-icon [descriptor]="entry.descriptor"></app-slot-icon>
      {{ entry.descriptor.label }}
    </div>

    @switch (entry.descriptor.kind) {
      @case ('numeric') {
        <app-min-mid-max-cell [cell]="entry.cell!"></app-min-mid-max-cell>
      }
      @case ('text') {
        <app-rich-text-edit-cell
          [cell]="entry.cell!"
          [showAiFillButton]="!!entry.descriptor.aiFillable"
          [aiFillLoading]="aiFillLoadingDescriptorId === entry.descriptor.id"
          (aiFillRequested)="aiFillRequested.emit(entry.descriptor)"
        ></app-rich-text-edit-cell>
      }
      @case ('intensity') {
        <app-intensity-cell [cell]="entry.cell!"></app-intensity-cell>
      }
      @case ('slot') {
        <app-bare-slot-cell
          [parentItem$]="treeNode.item$"
          [targetNodeId]="entry.targetNodeId"
          [descriptorId]="entry.descriptor.id"
        ></app-bare-slot-cell>
      }
    }

    <app-time-tracked-item-cell [item$]="entry.timeTrackItem$"></app-time-tracked-item-cell>

    <app-expand-toggle
      [isOpen]="openCommentsForDescriptorId === entry.descriptor.id"
      (isOpenChange)="onCommentsIsOpenChange(entry.descriptor.id, $event)"
    >
      <app-comment-thread [targetNodeId]="entry.targetNodeId"></app-comment-thread>
    </app-expand-toggle>
  </div>
  }
}

<app-slot-picker [treeNode]="treeNode" [descriptors]="descriptors"></app-slot-picker>
