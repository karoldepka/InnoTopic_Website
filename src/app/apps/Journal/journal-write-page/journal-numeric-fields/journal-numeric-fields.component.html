<ion-searchbar
  [(ngModel)]="search"
  [placeholder]="'JOURNAL.SEARCH_FIELDS_PLACEHOLDER' | translate"
  autofocus="autofocus"
  [debounce]="200"
  inputmode="search"
></ion-searchbar>

<ng-container
  *ngIf="showAny || ((search?.length || 0) > 2) || showAll"
>
  <ng-container
    *ngFor="let descriptor of numDescriptors"
  >
    <div class="field-with-comment"
      *ngIf="descriptor?.isShortListed || showAll || (isSearchEntered && descriptor.matchesSearch(search))"
      [hidden]="! descriptor.matchesSearch(search)"
    >
      <div class="journal-rating">
        <apf-star-rating
          class="journal-rating__stars"
          [allowZero]="true"
          [maxStars]="maxStars"
          [ngModel]="starValueFor(descriptor)"
          (numericValue)="onChangeStarValue($event, descriptor)"
        />
        <div class="journal-rating__field-name">
          {{descriptor.uiName}}
        </div>
        <button type="button" class="comment-toggle" (click)="toggleComment(descriptor)" [class.has-comment]="getComment(descriptor)">
          <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
          <span *ngIf="!isCommentOpen(descriptor)">{{ 'JOURNAL.NOTE' | translate }}</span>
          <span *ngIf="isCommentOpen(descriptor)">{{ 'JOURNAL.HIDE' | translate }}</span>
        </button>
        <app-voice-memo-field
          [item$]="journalEntry$"
          [fieldId]="descriptor.id!"
          (transcriptReady)="onTranscriptReady($event, descriptor)"
        ></app-voice-memo-field>
      </div>
      <ion-textarea
        *ngIf="isCommentOpen(descriptor)"
        class="field-comment"
        [attr.data-descriptor-id]="descriptor.id"
        [value]="getComment(descriptor)"
        (ionInput)="onChangeComment($any($event).detail.value, descriptor)"
        [placeholder]="'JOURNAL.ADD_NOTE_PLACEHOLDER' | translate"
        [autoGrow]="true"
        rows="2"
      ></ion-textarea>
    </div>

  </ng-container>

</ng-container>

<ion-button
  (click)="showAny = ! showAny"
>
  {{ 'JOURNAL.SHOW_CORE_RATINGS' | translate }}
</ion-button>

<ion-button
  (click)="showAll = ! showAll"
>
  {{ 'JOURNAL.SHOW_ALL' | translate }}
</ion-button>
