<ion-searchbar
  [(ngModel)]="search"
  placeholder="Search fields"
  autofocus="autofocus"
  [debounce]="200"
  inputmode="search"
></ion-searchbar>

<ng-container
  *ngIf="showAny || ((search?.length || 0) > 2) || showAll"
>
  <ng-container
    *ngFor="let descriptor of numDescriptors"
  >
    <div class="field-with-comment"
      *ngIf="descriptor?.isShortListed || showAll || (isSearchEntered && descriptor.matchesSearch(search))"
      [hidden]="! descriptor.matchesSearch(search)"
    >
      <apf-numeric-picker
        (numericValue)="onChangeNumericValue($event, descriptor)"
        [numFieldDef]="descriptor"
      ></apf-numeric-picker>
      <div class="comment-row">
        <button class="comment-toggle" (click)="toggleComment(descriptor)" [class.has-comment]="getComment(descriptor)">
          <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
          <span *ngIf="!isCommentOpen(descriptor)">Note</span>
          <span *ngIf="isCommentOpen(descriptor)">Hide</span>
        </button>
      </div>
      <ion-textarea
        *ngIf="isCommentOpen(descriptor)"
        class="field-comment"
        [value]="getComment(descriptor)"
        (ionInput)="onChangeComment($any($event).detail.value, descriptor)"
        placeholder="Add a note..."
        [autoGrow]="true"
        rows="2"
      ></ion-textarea>
    </div>

  </ng-container>

</ng-container>

<ion-button
  (click)="showAny = ! showAny"
>
  SHOW CORE RATINGS
</ion-button>

<ion-button
  (click)="showAll = ! showAll"
>
  SHOW ALL
</ion-button>
