<ion-button
  [disabled]="itemsService.loadingAllItemsFromServerInitiated"
  (press)="loadAll(true)"
  (click)="loadAll(false)"
><ion-icon slot=start name="download-outline" />Load all</ion-button>

<ion-note>{{(itemsService.localItems$ | async)?.length}} items loaded</ion-note>

<ion-checkbox
  labelPlacement="end"
  [formControl]="formControl"
>Sort ascending</ion-checkbox>


<!-- filter by mood, productivity, importance, health -->
<ion-range
  [formControl]="formControls.range"
  dualKnobs="true" min="-1" max="10" step="0.5" snaps="true"
  pin="true"
></ion-range> <!-- -1 for undefined -->
