<ion-header>

  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Occupations</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-checkbox
    *ngFor="let occupation of occupations"
    labelPlacement="end"
  >{{occupation.id}}</ion-checkbox>
</ion-content>
