<ion-icon
  style="color: var(--ion-color-secondary); vertical-align: middle; padding-top: 3px; font-size: 24px"
  class="tappable-icon actionable"
  (tap)="toggleExpand($event)"
  (press)="onPress($event)"
  [ngClass]="{collapsedIcon: ! treeNode.expanded}"
  name="chevron-down"
></ion-icon>
