<i
  *ngIf="! treeNode.isVisualRoot"
  style="color: var(--ion-color-secondary); vertical-align: middle; padding-top: 3px"
  class="material-icons tappable-icon actionable"
  (tap)="toggleExpand($event)"
  (press)="onPress($event)"
  [ngClass]="{collapsedIcon: ! treeNode.expanded}"
>
  <!-- any useful use-case of expansion icon at visual root, would be expand/collapse recursively
    but this is niche use, and could be put into popup menu
     (also via icon - webstorm has arrows up/down icon for expand/collapse all)
    -->


  <!--  {{ treeNode.hasChildren ? 'expand_more' : 'add_circle' }}-->
  <!-- Idea: add_circle icon if no children (therefore no expand/collapse) and would create child node -->
  expand_more
</i>

    - could be change detection problem?
    -> could directly listen to tree mode/node expansion events observable ? -->
